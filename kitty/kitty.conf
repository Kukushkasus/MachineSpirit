# MachineSpirit kitty theme
# Load the selected terminal integration after distro fish configuration.
shell fish --init-command 'source "$__fish_config_dir/machinespirit.fish"'
font_family      JetBrainsMono Nerd Font
font_size        11.5
cursor_shape     block
cursor_blink_interval 0
window_padding_width 12
confirm_os_window_close 0
# do not ask the compositor for the previous window size: it breaks tiling of the next window
remember_window_size no
initial_window_width  900
initial_window_height 560
enable_audio_bell no
hide_window_decorations yes
background_opacity 0.94

# colours are generated from the wallpaper by ms-theme
include colors.conf
