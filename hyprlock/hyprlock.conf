input-field {
    monitor =
    size = 400, 50
    outline_thickness = 1
    outer_color = rgba(86e6c4ff)
    inner_color = rgba(08110eff)
    font_color = rgba(86e6c4ff)
    fail_color = rgba(e8826aff)
    check_color = rgba(86e6c4ff)
    capslock_color = rgba(e2a35cff)
    font_family = IBM Plex Sans Condensed
    fade_on_empty = false
    placeholder_text = Enter passphrase
    fail_text = ACCESS DENIED
    check_text = AUTHENTICATING…
    dots_size = 0.28
    dots_spacing = 0.3
    rounding = 6
    position = 0, -100
    halign = center
    valign = center
}
