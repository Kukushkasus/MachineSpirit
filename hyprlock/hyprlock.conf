# fallback lock screen, used only when the shell isn't running (Settings: lockBackend).
# same look as the login screen, drawn with hyprlock's own elements, no auth delay
general {
    hide_cursor = true
}
animations {
    enabled = true
    bezier = settle, 0.2, 0, 0, 1
    animation = fadeIn, 1, 2, settle
    animation = fadeOut, 1, 2, settle
    animation = inputFieldDots, 1, 1, settle
}
background {
    monitor =
    path = screenshot
    color = rgba(070d0bff)
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.1
    noise = 0.012
}
# housing: a metal bezel with an inner line
shape {
    monitor =
    size = 480, 470
    color = rgba(0c1512e8)
    rounding = 14
    border_size = 3
    border_color = rgba(3b4843ff)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(00000066)
}
shape {
    monitor =
    size = 464, 454
    color = rgba(00000000)
    rounding = 10
    border_size = 1
    border_color = rgba(1b2c27ff)
    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = ●  S E A L E D
    color = rgba(86e6c4ff)
    font_size = 12
    font_family = IBM Plex Sans Condensed
    position = 0, 196
    halign = center
    valign = center
}
shape {
    monitor =
    size = 416, 1
    color = rgba(1f322cff)
    position = 0, 176
    halign = center
    valign = center
}
