# Authentication remains immediate; the empty password field stays visible.
general {
    hide_cursor = true
}
animations {
    enabled = true
    bezier = settle, 0.2, 0, 0, 1
    animation = fadeIn, 1, 2, settle
    animation = fadeOut, 1, 2, settle
    animation = inputFieldDots, 1, 1, settle
}
background {
    monitor =
    path = screenshot
    color = rgba(080e0cff)
    blur_passes = 2
    blur_size = 5
    brightness = 0.8
    contrast = 0.9
    vibrancy = 0.1
}
shape {
    monitor =
    size = 400, 400
    color = rgba(0c1512dc)
    rounding = 22
    border_size = 1
    border_color = rgba(71826870)
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000055)
}
label {
    monitor =
    text = M A C H I N E S P I R I T
    color = rgba(b5ca96ff)
    font_size = 12
    font_family = IBM Plex Sans
    position = 0, 175
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(dce8caff)
    font_size = 58
    font_family = IBM Plex Sans Condensed
    position = 0, 105
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a6b59cff)
    font_size = 12
    font_family = IBM Plex Sans
    position = 0, 48
    halign = center
    valign = center
}
label {
    monitor =
    text = THE COGITATOR IS SEALED
    color = rgba(718268ff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 8
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(9dbb85ff)
    inner_color = rgba(16241fff)
    font_color = rgba(dce8caff)
    fail_color = rgba(d88268ff)
    check_color = rgba(b5ca96ff)
    capslock_color = rgba(e2ba70ff)
    font_family = IBM Plex Sans
    fade_on_empty = false
    placeholder_text = Enter your password
    fail_text = Incorrect password. Try again.
    check_text = Unlocking...
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 12
    position = 0, -44
    halign = center
    valign = center
}
label {
    monitor =
    text = Type your password and press Enter
    color = rgba(a6b59cff)
    font_size = 12
    font_family = IBM Plex Sans
    position = 0, -96
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT
    color = rgba(718268ff)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -137
    halign = center
    valign = center
}
