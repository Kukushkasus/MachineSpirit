# [ PURITY SEAL ] Keep the signal clear. Preserve the entrusted work.
# Raw ASCII spectrum for the shell visualizer (read by services/Cava.qml).
[general]
bars = 16
framerate = 30
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 62
